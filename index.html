<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamran Remote Live</title>
    
    <!-- Link to Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5077/5077241.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0a192f; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.15); }
        .stream-container { position: relative; width: 100%; height: calc(100vh - 250px); min-height: 400px; display: flex; align-items: center; justify-content: center; background: #020617; border-radius: 1rem; overflow: hidden; box-shadow: inset 0 2px 20px rgba(0,0,0,0.8); border: 1px solid rgba(56, 189, 248, 0.1); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header class="glass-panel border-b border-sky-500/20 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div id="pingDot" class="w-3 h-3 bg-slate-500 rounded-full"></div>
            <h1 class="text-lg font-bold tracking-wide text-sky-400">Kamran Remote Live</h1>
        </div>
        
        <!-- Install Button -->
        <button id="installBtn" class="hidden flex items-center gap-2 bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg">
            <i data-lucide="download" class="w-4 h-4"></i> INSTALL APP
        </button>
    </header>

    <main class="flex-grow p-4 md:p-8 flex flex-col items-center justify-center max-w-6xl mx-auto w-full">
        <div class="glass-panel w-full rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
            <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-3 text-sm">
                    <span class="text-slate-400">Status:</span>
                    <span id="connectionStatus" class="text-amber-400 font-medium">Ready</span>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="startSession()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-xs font-bold">Start Stream</button>
                    <button onclick="stopSession()" class="bg-slate-800 hover:bg-rose-600 text-slate-300 px-5 py-2 rounded-lg text-xs font-bold">Stop</button>
                </div>
            </div>

            <div class="stream-container">
                <div id="placeholderView" class="text-center p-6 flex flex-col items-center justify-center">
                    <p class="text-slate-400 text-sm font-medium">Capture Offline</p>
                </div>
                <video id="remoteVideo" autoplay playsinline class="hidden"></video>
            </div>
        </div>
    </main>

    <footer class="glass-panel py-4 text-center text-[10px] text-slate-500 mt-auto uppercase tracking-widest">
        <p>Copyright © 2026 Create by Kamran Khan</p>
    </footer>

    <script>
        lucide.createIcons();
        const video = document.getElementById('remoteVideo');
        const placeholder = document.getElementById('placeholderView');
        const installBtn = document.getElementById('installBtn');
        let deferredPrompt;

        // Camera Logic
        async function startSession() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                placeholder.classList.add('hidden');
                video.classList.remove('hidden');
                document.getElementById('connectionStatus').innerText = "Live";
                document.getElementById('pingDot').className = "w-3 h-3 bg-emerald-400 rounded-full animate-pulse";
            } catch (err) { alert("Camera not found"); }
        }

        function stopSession() {
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            video.classList.add('hidden');
            placeholder.classList.remove('hidden');
            document.getElementById('connectionStatus').innerText = "Disconnected";
        }

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
